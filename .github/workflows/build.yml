name: Build Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # PR runs go through check → build (and mark-built on success).
    # Release publishing is gated on schedule/workflow_dispatch only, so PR builds
    # validate the workflow without producing a public release.
  workflow_dispatch:
    inputs:
      kiraai_ref:
        description: 'KiraAI git ref (leave empty for latest release incl. pre-release; or fill a tag / branch / commit SHA)'
        required: false
        default: ''
      force:
        description: 'Build even if this KiraAI release was already built (only relevant on schedule)'
        type: boolean
        default: false
  schedule:
    # Check for new KiraAI releases (stable OR pre-release) every 4 hours
    # (UTC 0/4/8/12/16/20 = Beijing 8/12/16/20/0/4). Builds only fire when
    # there is a release we have not built yet, so most ticks are no-ops.
    - cron: '0 */4 * * *'

permissions:
  contents: read

jobs:
  check:
    name: Check upstream KiraAI
    runs-on: ubuntu-latest
    outputs:
      kiraai_sha: ${{ steps.upstream.outputs.sha }}
      kiraai_short_sha: ${{ steps.upstream.outputs.short_sha }}
      kiraai_ref: ${{ steps.upstream.outputs.ref }}
      kiraai_prerelease: ${{ steps.upstream.outputs.prerelease }}
      build_date: ${{ steps.upstream.outputs.build_date }}
      release_tag: ${{ steps.upstream.outputs.release_tag }}
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Resolve upstream KiraAI release/SHA
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REF="${{ github.event.inputs.kiraai_ref }}"
          PRERELEASE="false"
          if [ -z "$REF" ]; then
            # Default: track newest release of ANY kind (stable or pre-release),
            # excluding drafts. /releases is sorted by created_at desc, so the
            # first non-draft entry is what we want.
            RESP=$(gh api 'repos/xxynet/KiraAI/releases?per_page=20' \
                     --jq '[.[] | select(.draft==false)] | .[0] | {tag:.tag_name, pre:.prerelease}' \
                     2>/dev/null || true)
            REF=$(printf '%s' "$RESP" | jq -r '.tag // empty')
            PRERELEASE=$(printf '%s' "$RESP" | jq -r '.pre // false')
            if [ -z "$REF" ]; then
              echo "Failed to fetch latest KiraAI release via gh api — aborting."
              exit 1
            fi
            echo "Latest KiraAI release: $REF (prerelease=$PRERELEASE)"
          else
            echo "Using user-provided ref: $REF"
            # Best-effort: look up whether this user-provided tag is a pre-release.
            PRERELEASE=$(gh api "repos/xxynet/KiraAI/releases/tags/$REF" --jq .prerelease 2>/dev/null || echo "false")
          fi
          # Resolve REF (tag → branch → raw SHA) to a concrete 40-char SHA.
          SHA=$(git ls-remote https://github.com/xxynet/KiraAI.git "refs/tags/$REF" | awk '{print $1}')
          if [ -z "$SHA" ]; then
            SHA=$(git ls-remote https://github.com/xxynet/KiraAI.git "refs/heads/$REF" | awk '{print $1}')
          fi
          if [ -z "$SHA" ]; then
            SHA="$REF"
          fi
          SHORT_SHA="${SHA:0:7}"
          BUILD_DATE=$(date -u +%Y-%m-%d)
          TAG_DATE=$(date -u +%Y%m%d)
          echo "ref=$REF"                              >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"                              >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA"                  >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE"                >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE"                >> "$GITHUB_OUTPUT"
          echo "release_tag=${TAG_DATE}-${SHORT_SHA}"  >> "$GITHUB_OUTPUT"
          echo "Tracking KiraAI @ $REF -> $SHA (prerelease=$PRERELEASE)"

      - name: Probe build cache for this SHA
        id: probe
        uses: actions/cache/restore@v4
        with:
          path: .build-marker
          key: kiraai-built-${{ steps.upstream.outputs.sha }}
          lookup-only: true

      - name: Decide whether to build
        id: decide
        shell: bash
        run: |
          FORCE="${{ github.event.inputs.force }}"
          CACHE_HIT="${{ steps.probe.outputs.cache-hit }}"
          EVENT="${{ github.event_name }}"
          echo "event=$EVENT  cache_hit=$CACHE_HIT  force=$FORCE"
          if [ "$EVENT" = "schedule" ] && [ "$CACHE_HIT" = "true" ] && [ "$FORCE" != "true" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "KiraAI release already built — skipping scheduled run."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: check
    if: needs.check.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact: kiraAI-DeskTop-windows
          - os: macos-latest
            script: build:mac
            artifact: kiraAI-DeskTop-macos
          - os: ubuntu-latest
            script: build:linux
            artifact: kiraAI-DeskTop-linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Electron shell
        uses: actions/checkout@v4

      - name: Clone KiraAI backend at resolved SHA
        shell: bash
        env:
          KIRAAI_SHA: ${{ needs.check.outputs.kiraai_sha }}
          KIRAAI_REF: ${{ needs.check.outputs.kiraai_ref }}
        run: |
          # Shallow clone, then check out the exact SHA the check job resolved,
          # so all three matrix legs build identical bits even if upstream moves.
          git clone --filter=blob:none https://github.com/xxynet/KiraAI.git backend
          cd backend
          git checkout --detach "$KIRAAI_SHA"
          KIRAAI_VER=$(git describe --tags --always 2>/dev/null || echo "$KIRAAI_SHA")
          echo "KIRAAI_VER=$KIRAAI_VER" >> "$GITHUB_ENV"
          echo "Cloned KiraAI $KIRAAI_VER ($KIRAAI_SHA) from ref=$KIRAAI_REF"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build KiraAI WebUI frontend
        shell: bash
        working-directory: backend/webui/frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build

      - name: Stage frontend dist for runtime
        shell: bash
        run: |
          set -e
          mkdir -p backend/data/dist
          if [ -d backend/webui/static/dist ] && [ -n "$(ls -A backend/webui/static/dist 2>/dev/null)" ]; then
            cp -R backend/webui/static/dist/. backend/data/dist/
          elif [ -d backend/webui/frontend/dist ] && [ -n "$(ls -A backend/webui/frontend/dist 2>/dev/null)" ]; then
            cp -R backend/webui/frontend/dist/. backend/data/dist/
          else
            echo "ERROR: no frontend build output found under backend/webui/static/dist or backend/webui/frontend/dist"
            find backend/webui -maxdepth 3 -name dist -type d || true
            exit 1
          fi
          echo "$KIRAAI_VER" > backend/data/dist/.version
          echo "Staged frontend dist (KiraAI $KIRAAI_VER)"

      - name: Setup Python for icon generation
        if: matrix.os != 'windows-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate cross-platform icon (mac/linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p build
          # Pillow handles multi-frame ICO correctly across platforms.
          # setup-python gives us an isolated interpreter so pip install is not
          # blocked by PEP 668 (externally-managed-environment) on macOS-latest.
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          src = 'assets/KD-LOGO.ico'
          img = Image.open(src)
          sizes = img.info.get('sizes') or [img.size]
          print(f'ICO frames in {src}: {sizes}')
          largest = max(sizes, key=lambda s: s[0] * s[1])
          img.size = largest
          img.load()
          img = img.convert('RGBA').resize((1024, 1024), Image.LANCZOS)
          out = 'build/icon.png'
          img.save(out)
          print(f'Wrote {out} (1024x1024, upscaled from {largest})')
          PY
          ls -lh build/icon.png

      - name: Generate dmg background placeholder (mac)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          # electron-builder 24.x with macOS-14+ runners crashes when dmgbuild
          # tries to create an Alias for its bundled background.tiff. Providing
          # an explicit (even blank) PNG sidesteps the buggy alias creation.
          python - <<'PY'
          from PIL import Image
          Image.new('RGBA', (540, 380), (26, 26, 46, 255)).save('build/background.png')
          print('Wrote build/background.png placeholder (540x380)')
          PY
          ls -lh build/background.png

      - name: Install Electron shell deps
        run: npm install

      - name: Compute app version
        shell: bash
        env:
          KIRAAI_REF: ${{ needs.check.outputs.kiraai_ref }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
        run: |
          # Mirror the upstream tag as our app version (strip leading 'v').
          # Supports both stable (v1.2.3) and pre-release (v1.2.3-rc1) forms;
          # both are valid semver, which is what electron-builder requires.
          # Fall back to a date-based version if upstream tag isn't semver-ish.
          CANDIDATE=$(echo "$KIRAAI_REF" | sed 's/^v//')
          if echo "$CANDIDATE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$'; then
            APP_VERSION="$CANDIDATE"
          else
            APP_VERSION="0.0.0-build.${RELEASE_TAG}"
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "App version: $APP_VERSION (from upstream $KIRAAI_REF)"

      - name: Run electron-builder
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.script }} -- --config.extraMetadata.version="$APP_VERSION"

      - name: List build output
        shell: bash
        run: ls -lah dist || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish Rolling Release
    needs: [check, build]
    if: >
      success() &&
      needs.check.outputs.should_build == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten release assets
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f \( \
            -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \
            -o -name '*.blockmap' -o -name 'latest*.yml' \
          \) -exec cp {} release/ \;
          ls -lah release

      - name: Compose release body
        id: body
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIRAAI_REF: ${{ needs.check.outputs.kiraai_ref }}
          KIRAAI_SHA: ${{ needs.check.outputs.kiraai_sha }}
          KIRAAI_SHORT: ${{ needs.check.outputs.kiraai_short_sha }}
          KIRAAI_PRERELEASE: ${{ needs.check.outputs.kiraai_prerelease }}
          BUILD_DATE: ${{ needs.check.outputs.build_date }}
        run: |
          # Numeric version (strip leading 'v') for asset-filename hints in the
          # download list. electron-builder embeds this exact string in dmg/exe
          # filenames, so users see e.g. "kiraAI-DeskTop-2.16.5-arm64.dmg".
          VER_NUM=$(echo "$KIRAAI_REF" | sed 's/^v//')

          if [ "$KIRAAI_PRERELEASE" = "true" ]; then
            UPSTREAM_KIND="**pre-release**"
            PRE_NOTE=$'\n> 🧪 Upstream KiraAI tag `'"${KIRAAI_REF}"$'` is a **pre-release** — expect rough edges. / 该构建基于 KiraAI 预发布版本，可能不稳定。\n'
          else
            UPSTREAM_KIND="stable release"
            PRE_NOTE=""
          fi

          # Fetch upstream release notes (.body). Empty / missing → block is
          # omitted entirely. Stored in a file via printf %s to avoid bash
          # re-evaluating backticks or $(...) inside the upstream markdown.
          UPSTREAM_BODY=$(gh api "repos/xxynet/KiraAI/releases/tags/$KIRAAI_REF" --jq '.body // ""' 2>/dev/null || printf '')
          UPSTREAM_BLOCK=""
          if [ -n "$(printf '%s' "$UPSTREAM_BODY" | tr -d '[:space:]')" ]; then
            {
              printf '<details>\n'
              printf '<summary>📝 What'\''s new in KiraAI %s (上游更新内容)</summary>\n\n' "$KIRAAI_REF"
              printf '%s\n\n' "$UPSTREAM_BODY"
              printf '[Full release notes / 完整更新日志 →](https://github.com/xxynet/KiraAI/releases/tag/%s)\n\n' "$KIRAAI_REF"
              printf '</details>\n'
            } > /tmp/upstream-block.md
            UPSTREAM_BLOCK=$(cat /tmp/upstream-block.md)
          fi

          cat > release-body.md <<EOF
          # KiraAI ${KIRAAI_REF} — Desktop Build ${BUILD_DATE}
          ${PRE_NOTE}
          > ⚠️ This is an **unsigned** build for testing. / 未签名测试构建。

          **Tracking KiraAI:** [\`${KIRAAI_REF}\`](https://github.com/xxynet/KiraAI/releases/tag/${KIRAAI_REF}) — ${UPSTREAM_KIND} (commit [\`${KIRAAI_SHORT}\`](https://github.com/xxynet/KiraAI/commit/${KIRAAI_SHA}))

          ---

          ## 📦 Download / 下载

          Pick the file that matches your OS. / 请下载对应你系统的文件：

          - **Windows** → \`kiraAI-DeskTop Setup ${VER_NUM}.exe\` (NSIS installer / 安装器)
          - **macOS (Apple Silicon, M1/M2/M3+)** → \`kiraAI-DeskTop-${VER_NUM}-arm64.dmg\`
          - **macOS (Intel)** → \`kiraAI-DeskTop-${VER_NUM}.dmg\` (no \`-arm64\` suffix / 不带 \`-arm64\`)
          - **Linux** → \`*.AppImage\` (portable / 开箱即用) or \`*.deb\` (Debian / Ubuntu apt)

          > 💡 First launch creates a Python venv and installs deps automatically. Requires **Python 3.10+** on PATH.
          > 首次启动会自动创建 venv 并安装依赖，需要系统已安装 **Python 3.10+**。

          ${UPSTREAM_BLOCK}

          <details>
          <summary>🍎 macOS: "kiraAI-DeskTop is damaged and can't be opened" / macOS 提示"已损坏"？</summary>

          Because this is an unsigned build, macOS Gatekeeper blocks it. Open Terminal and run:
          这是未签名构建被 Gatekeeper 拦截。打开"终端"运行：

          \`\`\`
          xattr -cr /Applications/kiraAI-DeskTop.app
          \`\`\`

          Then open the app normally. / 之后即可正常打开。

          </details>
          EOF
          echo "--- release body ---"
          cat release-body.md

      - name: Publish release for upstream tag
        uses: softprops/action-gh-release@v2
        with:
          # Per-version, non-rolling: tag mirrors the upstream KiraAI tag, so
          # each upstream release produces its own persistent GitHub release.
          # If the tag already exists (e.g. workflow_dispatch with force=true),
          # softprops/action-gh-release updates the release in place.
          tag_name: ${{ needs.check.outputs.kiraai_ref }}
          name: KiraAI ${{ needs.check.outputs.kiraai_ref }} (built ${{ needs.check.outputs.build_date }})
          body_path: release-body.md
          prerelease: false
          files: release/*
          make_latest: 'true'

  mark-built:
    name: Mark SHA built (cache)
    needs: [check, build]
    if: success() && needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Write marker
        shell: bash
        run: |
          mkdir -p .build-marker
          echo "${{ needs.check.outputs.kiraai_sha }}" > .build-marker/sha.txt
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .build-marker/built_at.txt
          cat .build-marker/sha.txt
      - name: Save build marker to cache
        uses: actions/cache/save@v4
        with:
          path: .build-marker
          key: kiraai-built-${{ needs.check.outputs.kiraai_sha }}
